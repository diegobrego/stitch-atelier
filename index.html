<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Stitch Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout concept: a framed workspace. Slim tool rail | pattern canvas on graph paper | thread palette panel.
   Rico thread colours are the only saturated things on screen; the UI itself stays cool grey with one teal accent. */
:root {
  --bg: #E7EAF0; --panel: #FFFFFF; --panel-2: #F2F4F8; --ink: #19202E; --muted: #5A6477; --line: #D2D8E2;
  --accent: #0D7686; --accent-ink: #FFFFFF; --accent-soft: #D7EEF1; --danger: #B3291F; --ok: #2B7A4B; --warn: #9A6200;
  --stage: #D5DAE4; --ruler: #F2F4F8; --ruler-ink: #5A6477; --grid: rgba(25,32,46,.16); --grid-major: rgba(25,32,46,.55);
  --shadow: 0 1px 2px rgba(20,28,45,.08), 0 8px 24px rgba(20,28,45,.12);
  --f-display: system-ui, 'Segoe UI Variable Display', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --f-body: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --f-mono: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111419; --panel: #1A1F27; --panel-2: #232A35; --ink: #E7EBF2; --muted: #9AA5B8; --line: #2E3745;
    --accent: #55C4D1; --accent-ink: #08191C; --accent-soft: #17343A; --danger: #FF8A7E; --ok: #6FD39A; --warn: #F0B45A;
    --stage: #0D1015; --ruler: #232A35; --ruler-ink: #9AA5B8; --grid: rgba(231,235,242,.14); --grid-major: rgba(231,235,242,.5);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111419; --panel: #1A1F27; --panel-2: #232A35; --ink: #E7EBF2; --muted: #9AA5B8; --line: #2E3745;
  --accent: #55C4D1; --accent-ink: #08191C; --accent-soft: #17343A; --danger: #FF8A7E; --ok: #6FD39A; --warn: #F0B45A;
  --stage: #0D1015; --ruler: #232A35; --ruler-ink: #9AA5B8; --grid: rgba(231,235,242,.14); --grid-major: rgba(231,235,242,.5);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.35;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i.sm { width: 16px; height: 16px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.grow { flex: 1 1 auto; min-width: 0; }

/* ---------- shell ---------- */
#app { height: 100%; min-height: 480px; display: grid; gap: 8px; min-width: 0;
  grid-template-columns: 56px minmax(0,1fr) 316px; grid-template-rows: auto minmax(0,1fr);
  grid-template-areas: "top top top" "tools stage side"; }
#top { grid-area: top; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
#tools { grid-area: tools; display: flex; flex-direction: column; gap: 4px; padding: 6px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; min-height: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
#stage { grid-area: stage; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
#side { grid-area: side; display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; padding-right: 4px; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
#title { width: clamp(120px, 18vw, 240px); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; font-weight: 600; min-width: 0; }
#title:hover { border-color: var(--line); }
#title:focus { border-color: var(--accent); outline: none; background: var(--panel-2); }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--panel); font-weight: 500; white-space: nowrap; line-height: 1.2; }
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--panel-2); }
.btn.icon { padding: 7px; }
.btn.sm { padding: 4px 8px; font-size: 12.5px; border-radius: 7px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--panel-2); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg.icons button { padding: 6px 8px; }

.tool { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; border: 1px solid transparent; background: transparent; position: relative; flex: none; }
.tool:hover { background: var(--panel-2); }
.tool.on { background: var(--accent); color: var(--accent-ink); }
.tool kbd { position: absolute; right: 3px; bottom: 1px; font: 500 9px var(--f-mono); opacity: .55; }
.tool-sep { height: 1px; background: var(--line); margin: 3px 4px; flex: none; }
.layer-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; background: var(--panel-2); border-radius: 10px; flex: none; }
.layer-switch button { border: 0; background: transparent; border-radius: 8px; padding: 4px 0; display: grid; place-items: center; }
.layer-switch button.on { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.15); color: var(--accent); }

/* ---------- stage ---------- */
#opts { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 6px 10px; min-height: 44px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
#opts .lab { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
#opts .og { display: flex; align-items: center; gap: 4px; }
#cvwrap { position: relative; flex: 1 1 auto; min-height: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--stage); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: crosshair; }
#status { position: absolute; left: 28px; bottom: 8px; display: flex; gap: 12px; padding: 3px 9px; border-radius: 999px; font: 500 11.5px var(--f-mono);
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); pointer-events: none; max-width: calc(100% - 40px); white-space: nowrap; overflow: hidden; }
.float-hint { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }

/* ---------- side panel ---------- */
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 10px 6px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabpane { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.tabpane[hidden] { display: none !important; }
.cur { display: flex; gap: 10px; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); flex: none; }
.sw { overflow: hidden; }
.sw canvas { width: 100%; height: 100%; display: block; }
.cur .sw { width: 46px; height: 46px; border-radius: 9px; border: 1px solid rgba(0,0,0,.25); display: grid; place-items: center; flex: none; }
.cur .meta { min-width: 0; line-height: 1.3; }
.cur .meta b { font-family: var(--f-display); font-size: 16px; }
.cur .meta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-actions { display: flex; gap: 6px; padding: 8px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); flex: none; }
.pal-list { list-style: none; margin: 0; padding: 4px 6px 10px; display: flex; flex-direction: column; gap: 2px; }
.pal-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 9px; align-items: center; padding: 5px 6px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; }
.pal-item:hover { background: var(--panel-2); }
.pal-item.on { background: var(--accent-soft); border-color: var(--accent); }
.pal-item .sw { width: 30px; height: 30px; border-radius: 7px; border: 1px solid rgba(0,0,0,.25); display: grid; place-items: center; }
.pal-item .nm { min-width: 0; line-height: 1.25; }
.pal-item .nm b { font: 500 13px var(--f-mono); }
.pal-item .nm span { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-item .ct { font: 500 12px var(--f-mono); color: var(--muted); text-align: right; }
.pal-item .more { opacity: 0; border: 0; background: transparent; padding: 2px; border-radius: 6px; color: var(--muted); }
.pal-item:hover .more, .pal-item.on .more, .pal-item .more:focus-visible { opacity: 1; }
.pal-empty { padding: 22px 18px; color: var(--muted); text-align: center; }
.info-block { padding: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.info-block h4 { margin: 0; font: 600 11px var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { font-family: var(--f-mono); text-align: right; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.field label { color: var(--muted); }
select, input[type="number"], input[type="text"], input[type="search"], textarea {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
input[type="color"] { width: 38px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: none; }
.mat { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.mat th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 0 4px 5px; }
.mat td { padding: 3px 4px; border-top: 1px solid var(--line); }
.mat td.r, .mat th.r { text-align: right; font-family: var(--f-mono); }
.mat .dot { width: 14px; height: 14px; border-radius: 4px; display: inline-block; vertical-align: -3px; border: 1px solid rgba(0,0,0,.25); margin-right: 6px; }

/* ---------- dialogs ---------- */
#overlay { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(8,12,20,.55); padding: 14px; }
#overlay.show { display: grid; }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: 100%;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.dlg.wide { width: min(1080px, 100%); height: min(780px, 100%); }
.dlg.mid { width: min(760px, 100%); }
.dlg-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex: none; }
.dlg-h h2 { margin: 0; font: 700 18px var(--f-display); letter-spacing: -.01em; flex: 1; }
.dlg-b { padding: 16px; overflow: auto; min-height: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.hint { font-size: 12.5px; color: var(--muted); }
.menu { position: fixed; z-index: 60; min-width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 5px; display: none; }
.menu.show { display: block; }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: transparent; border-radius: 8px; text-align: left; }
.menu button:hover { background: var(--panel-2); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.menu .sub { font-size: 11px; color: var(--muted); margin-left: auto; font-family: var(--f-mono); }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 80;
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 500; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* colour picker */
.pick-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pick-tools input[type="search"] { flex: 1 1 180px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
.swb { position: relative; aspect-ratio: 1; border-radius: 9px; border: 1px solid rgba(0,0,0,.28); display: flex; align-items: flex-end; justify-content: center; padding: 0 0 3px; font: 500 11px var(--f-mono); }
.swb:hover { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 1; }
.swb.has::after { content: ""; position: absolute; right: 4px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #fff; }
.swb.cur-c { outline: 2px solid var(--ink); outline-offset: 1px; }
.nearest { display: flex; gap: 6px; flex-wrap: wrap; }

/* photo importer */
.imp { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 14px; min-height: 0; flex: 1; }
.imp-views { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; min-height: 0; }
.imp-view { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; }
.imp-view .box { flex: 1 1 auto; min-height: 220px; border: 1px solid var(--line); border-radius: 12px; background: var(--stage); position: relative; overflow: hidden; display: grid; place-items: center; }
.imp-view canvas { max-width: 100%; max-height: 100%; display: block; image-rendering: pixelated; }
#impSrcWrap { position: relative; line-height: 0; max-width: 100%; max-height: 100%; touch-action: none; }
#impSrcWrap canvas { image-rendering: auto; }
#impCrop { position: absolute; border: 2px solid var(--accent); box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none; }
.imp-side { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; padding-right: 4px; }
.ctl { display: flex; flex-direction: column; gap: 3px; }
.ctl .row { display: flex; justify-content: space-between; gap: 8px; }
.ctl .row b { font: 500 12.5px var(--f-mono); }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 28px 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px 2px 3px; border-radius: 999px; border: 1px solid var(--line); font: 500 11px var(--f-mono); }
.chip i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.3); }

.proj-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.proj { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: var(--panel-2); }
.proj .th { aspect-ratio: 4/3; display: grid; place-items: center; background: var(--stage); }
.proj .th img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
.proj .pm { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.proj .pm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .pa { display: flex; gap: 4px; padding: 0 8px 8px; }

.help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 22px; }
.help-grid div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding: 3px 0; }
kbd.k { font: 500 11px var(--f-mono); padding: 1px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); }

/* ---------- narrow screens ---------- */
#sideToggle { display: none; }
@media (max-width: 980px) {
  #app { grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,1fr) auto;
    grid-template-areas: "top" "stage" "tools"; }
  #tools { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 4px; }
  .tool { width: 42px; height: 42px; }
  .tool kbd { display: none; }
  .tool-sep { width: 1px; height: auto; align-self: stretch; margin: 4px 3px; }
  .layer-switch { grid-template-columns: 1fr 1fr; width: 76px; }
  #side { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(66px + env(safe-area-inset-bottom, 0px)); top: 70px; z-index: 40; box-shadow: var(--shadow); display: none; }
  #side.open { display: flex; }
  #sideToggle { display: inline-flex; }
  .imp { grid-template-columns: minmax(0,1fr); }
  .dlg.wide { height: 100%; }
  .brand span { display: none; }
}
@media (max-width: 640px) {
  .btn .lbl { display: none; }
  .imp-views { grid-template-columns: minmax(0,1fr); }
  .grid2 { grid-template-columns: minmax(0,1fr); }
  #title { width: 100%; order: 9; flex: 1 0 100%; }
  .seg button { padding: 6px 7px; }
}
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

</head>

/* ============================================================
   Sample pattern + start-up wiring
   ============================================================ */
function makeSample() {
  const W = 56, H = 40, p = new Pattern(W, H, t('sampleTitle')); setPattern(p);
  const col = hx => ensureColor(nearestRico(hex2rgb(hx.slice(1))).id), px = (x, y, v) => { if (x >= 0 && y >= 0 && x < W && y < H) p.full[y * W + x] = v; };
  const sky = ['#2F5DA8', '#6E8FCB', '#B98ABF', '#F09A94', '#F4B25E', '#F7CF6B'].map(col), hz = 27;
  for (let y = 0; y < hz + 6; y++) { const f = Math.min(y, hz - 1) / hz * 6, b = Math.min(5, Math.floor(f)), fr = f - b; for (let x = 0; x < W; x++) px(x, y, fr > 0.7 && (x + y) % 2 === 0 ? sky[Math.min(5, b + 1)] : sky[b]); }
  const sunC = col('#FFF1B8'), sunE = col('#FFD36B');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const d = Math.hypot(x + 0.5 - 36, y + 0.5 - 25); if (d <= 8) px(x, y, d > 6.6 ? sunE : sunC); }
  const hills = [['#7B5E9A', 28, 2.4, 5.5, 1], ['#4B4A83', 31, 2.8, 7, 3], ['#2A3558', 34, 2.2, 4.5, 5]];
  for (const [hx, base, amp, fr, ph] of hills) { const v = col(hx); for (let x = 0; x < W; x++) { const top = Math.round(base + Math.sin(x / fr + ph) * amp + Math.sin(x / (fr * 2.3) + ph * 2) * amp * 0.5); for (let y = top; y < H; y++) px(x, y, v); } }
  const lake = col('#1B2A47'), glow = col('#F8C26A');
  for (let y = 35; y < H; y++) for (let x = 0; x < W; x++) px(x, y, lake);
  for (let i = 0; i < 4; i++) for (let x = 31 + i; x < 41 - i; x++) if ((x + i) % 3) px(x, 35 + i, glow);
  const star = col('#FFFFFF'); for (const [x, y] of [[6, 3], [14, 6], [22, 2], [30, 5], [44, 3], [51, 7], [9, 11], [47, 12]]) px(x, y, star);
  const ink = col('#101826'), seg = (x1, y1, x2, y2) => p.back.push({ x1, y1, x2, y2, c: ink });
  for (const [bx, by] of [[10, 14], [16, 17.5], [21, 12]]) { seg(bx, by, bx + 1.5, by - 1); seg(bx + 1.5, by - 1, bx + 3, by); seg(bx + 3, by, bx + 4.5, by - 1); seg(bx + 4.5, by - 1, bx + 6, by); }
  resetHistory(); ui.color = sunE; refreshPalette(); refreshInfo(); fitView(); requestRender();
}

function wireTopbar() {
  $('btnUndo').onclick = undo; $('btnRedo').onclick = redo;
  $('btnZoomIn').onclick = () => zoomAt(1.25); $('btnZoomOut').onclick = () => zoomAt(0.8); $('zoomLabel').onclick = fitView;
  $('btnGrid').onclick = () => { ui.grid = !ui.grid; $('btnGrid').classList.toggle('on', ui.grid); requestRender(); }; $('btnGrid').classList.add('on');
  $('btnPhoto').onclick = () => openImporter(); $('btnExport').onclick = openExport; $('btnHelp').onclick = openHelp;
  $('btnLang').onclick = () => { lang = lang === 'de' ? 'en' : 'de'; LS.set('sa.lang', lang); applyLang(); };
  $('btnFile').onclick = e => showMenu(e.currentTarget, [
    { icon: 'plus', label: t('newPattern'), fn: openNewDialog }, { icon: 'file', label: t('myPatterns'), fn: openProjects }, { icon: 'file', label: t('openFile'), fn: () => $('fileOpen').click() },
    { icon: 'export', label: t('saveFile'), sub: 'Ctrl+S', fn: exportProject }, { hr: true }, { icon: 'photo', label: t('photoBtn'), fn: () => openImporter() }, { icon: 'fit', label: t('resize'), fn: openResize }]);
  $('sideToggle').onclick = () => $('side').classList.toggle('open');
  $('title').addEventListener('input', e => { P.title = e.target.value; saveSoon(); });
  const tab = which => { $('panePal').hidden = which !== 'pal'; $('paneInfo').hidden = which !== 'info'; $('tabBtnPal').classList.toggle('on', which === 'pal'); $('tabBtnInfo').classList.toggle('on', which === 'info'); if (which === 'info') refreshInfo(); };
  $('tabBtnPal').onclick = () => tab('pal'); $('tabBtnInfo').onclick = () => tab('info');
  $('btnAddColor').onclick = () => openColorPicker({ mode: 'add' }); $('btnCleanPal').onclick = cleanPalette;
  $('fileOpen').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importProjectFile(f); });
  $('fileImg').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if ($('overlay').classList.contains('show') && imp && imp.handleFile && document.getElementById('impSide')) imp.handleFile(f); else openImporter(f);
  });
  addEventListener('beforeunload', saveIfDirty);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveIfDirty(); });
}

function boot() {
  readTheme(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  resizeCanvas(); new ResizeObserver(resizeCanvas).observe($('cvwrap'));
  const vm = LS.get('sa.view'); if (VIEW_MODES.some(x => x[0] === vm)) ui.viewMode = vm;
  wireTopbar();
  const last = LS.get('sa.last'), p = last ? loadProject(last) : null;
  if (p) setPattern(p); else { makeSample(); toast(t('welcome'), 5200); }
  applyLang(); fitView(); updateUndo();
  document.fonts && document.fonts.ready.then(() => { sprites.clear(); requestRender(); });
}
boot();

</script>
</body>
